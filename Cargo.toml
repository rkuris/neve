[package]
name = "neve"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ron Kuris <ron.kuris@avalabs.org>"]
description = "A read-only cache for avalanchego's JSON-RPC frontend API, backed by a local block store."
license = "MIT"
repository = "https://github.com/rkuris/neve"
homepage = "https://github.com/rkuris/neve"
readme = "README.md"
keywords = ["avalanche", "json-rpc", "cache", "blockchain"]
categories = ["caching", "cryptography::cryptocurrencies"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blockstore = { git = "https://github.com/rkuris/blockstore.git", rev = "e039d10bacd41317aec1b3d74d35238ad64eb2ef" }
fjall = "3"
hex = "0.4"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tower = "0.5"
http-body-util = "0.1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
clap = { version = "4", features = ["derive"] }
parse_duration = "2"
memory-stats = "1"
human_bytes = "0.4"
humantime = "2"
metrics-process = "2.4.3"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"
explicit_deref_methods = "warn"
missing_const_for_fn = "warn"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "deny"
str_to_string = "warn"
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
