[package]
name = "neve"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
authors = ["Ron Kuris <ron.kuris@avalabs.org>"]
description = "A read-only cache for avalanchego's JSON-RPC frontend API, backed by a local block store."
license = "MIT"
repository = "https://github.com/rkuris/neve"
homepage = "https://github.com/rkuris/neve"
readme = "README.md"
keywords = ["avalanche", "json-rpc", "cache", "blockchain"]
categories = ["caching", "cryptography::cryptocurrencies"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value` powers the combined `[block, logs]` record codec (src/record.rs):
# it splits the stored array into its halves without reserializing the block, so
# the block half stays byte-identical to the upstream RPC response.
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blockstore = { package = "blockdb", version = "0.4.0", features = ["metrics"] }
fjall = "3"
hex = "0.4"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
# We host jsonrpsee's TowerService under our own hyper accept loop (via
# `to_service_builder`) so each connection can carry a read-idle timeout
# jsonrpsee can't do itself (see src/conn.rs, src/rpc.rs `serve`).
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tower = "0.5"
http-body-util = "0.1"
http-body = "1"
http = "1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# `env` lets the upstream URLs be supplied through the environment instead of
# argv. That matters because the public endpoint's rate-limit bypass token rides
# in the URL query, and argv is world-readable via /proc/<pid>/cmdline while a
# process's environment is not.
clap = { version = "4", features = ["derive", "env"] }
parse_duration = "2"
memory-stats = "1"
human_bytes = "0.4"
humantime = "2"
metrics-process = "2.4.3"
# CB58 (base58 + 4-byte checksum) is how the P-chain spells every 32-byte ID —
# block IDs, tx IDs — so `bs58` sits on the ingest/serving boundary for the
# platform dialect (src/platform/codec.rs).
bs58 = "0.5"
# SHA-256 backs three P-chain invariants at once: blockID == sha256(blockBytes)
# (so stored bytes are self-verifying), the CB58 checksum, and the 4-byte
# checksum avalanchego's `hex`/`hexc` encodings append.
sha2 = "0.10"
# jemalloc, because neve's RSS is dominated by fragmentation rather than live
# data. Measured on the production t4g.small under an active C-chain backfill:
# 440 MiB of anonymous memory, *all* of it private and dirty (so nothing is
# reclaimable under pressure — it is swap or OOM), of which 216 MiB sat on 2 MiB
# transparent huge pages. That is the classic glibc profile: per-thread arenas
# retain freed chunks and rarely return them to the OS, and huge pages round the
# retention up. jemalloc purges on a decay timer instead, and does not opt into
# THP by default.
#
# Off is still expressible (`--no-default-features`) for a platform where
# jemalloc will not build. It adds no new build requirement: `zstd-sys` already
# makes a C compiler mandatory, and `deploy/cloud-init.yaml` installs
# `build-essential` on first boot.
tikv-jemallocator = { version = "0.7", optional = true }
# The config file (src/config.rs). `toml::Value` is load-bearing beyond parsing:
# every override — environment variables, the deprecated flags, `--set` — is
# applied by mutating the parsed document and re-deserializing it, so one
# `deny_unknown_fields` schema validates the file and the command line alike and
# a typo'd `--set` key is an error naming the key rather than a silent no-op.
toml = "1.1.4"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]` for deterministic,
# instant timer tests (src/conn.rs idle-timeout smoke tests).
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"
explicit_deref_methods = "warn"
missing_const_for_fn = "warn"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "deny"
str_to_string = "warn"
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
