#cloud-config
# Bring up a fresh Ubuntu host that auto-builds and runs neve as a systemd
# service. Paste this as EC2 user-data (or pass via `cloud-init` elsewhere).
#
# Works on x86_64 and arm64 (e.g. t4g.*) — rustup picks the right toolchain.
# After boot, the service binds 0.0.0.0:8545 (see the write_files block below),
# so it is reachable on the instance's public IP: `curl http://<ip>:8545/health`.
# This intentionally leaves access control to the EC2 security group — scope the
# 8545 ingress rule to your IP if you don't want it world-readable. To keep it
# loopback-only instead, set `addr = "127.0.0.1:8545"` under [server] in
# /etc/neve/config.toml.
#
# Build/provision progress is logged to /var/log/neve-bootstrap.log.

package_update: true
packages:
  - git
  - build-essential
  - curl
  - ca-certificates

users:
  - default
  - name: rkuris
    groups: "users, adm, sudo"
    shell: /usr/bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL2RVmfpoKYi0tJd2DhQEp8tB3m2PSuaYxIfnLwqt03u cardno:23_537_110 ron"

write_files:
  # Minimal on purpose. bootstrap.sh installs the fully annotated reference
  # alongside it as /etc/neve/config.toml.example (also `neve
  # --print-config-example`), and `neve --print-config` prints what this box
  # actually resolved to, so the live file only has to carry what differs from
  # neve's built-in defaults. bootstrap.sh will not overwrite this file.
  - path: /etc/neve/config.toml
    permissions: "0644"
    content: |
      [server]
      # Serve beyond localhost; the EC2 security group is the access control.
      addr = "0.0.0.0:8545"

      [defaults]
      # Applies to every enabled chain. One summary line per chain per minute
      # is a readable `journalctl -u neve -f`; neve's own default is 5m.
      summary_period = "1m"

      # A table per chain, and its presence is what enables that chain. Empty
      # tables take the built-in defaults: the C-chain anchored at the first
      # live block, the P-chain from genesis.
      [chains.c]
      [chains.p]

      # Rate-limit bypass token, if this host has one. See /etc/neve/neve.env.
      # [upstream]
      # token_file = "/etc/neve/token"

runcmd:
  - git clone --depth 1 https://github.com/rkuris/neve.git /opt/neve
  - bash /opt/neve/deploy/bootstrap.sh 2>&1 | tee /var/log/neve-bootstrap.log
